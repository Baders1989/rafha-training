<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الحضور — التدريب الصيفي 1447هـ</title>
<style>
:root {
  --g1: #0f3d2e; --g2: #14532d; --g3: #166534; --g4: #15803d;
  --green-light: #dcfce7; --green-accent: #22c55e;
  --amber: #f59e0b; --red: #ef4444;
  --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
  --gray-400: #9ca3af; --gray-600: #4b5563; --gray-800: #1f2937;
  --white: #ffffff; --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

.header { background: linear-gradient(135deg, var(--g1), var(--g2)); color: var(--white); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.header-title { font-size: 1rem; font-weight: 700; }
.header-sub { font-size: .75rem; opacity: .75; margin-top: 2px; }
.user-badge { background: rgba(255,255,255,.15); border-radius: 20px; padding: 5px 12px; font-size: .8rem; }

.container { max-width: 1400px; margin: 0 auto; padding: 16px; }

.controls { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctrl-label { font-size: .8rem; font-weight: 700; color: var(--g2); white-space: nowrap; }
.ctrl-select { border: 2px solid var(--gray-200); border-radius: 8px; padding: 8px 12px; font-size: .88rem; font-family: inherit; color: var(--gray-800); background: var(--white); cursor: pointer; min-width: 260px; }
.ctrl-select:focus { outline: none; border-color: var(--green-accent); }
.btn-save-all { background: var(--g2); color: var(--white); border: none; border-radius: 8px; padding: 8px 20px; font-size: .85rem; font-weight: 700; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-right: auto; }
.btn-save-all:hover { background: var(--g3); }
.btn-save-all:disabled { background: var(--gray-400); cursor: not-allowed; }

.legend { display: flex; gap: 12px; align-items: center; font-size: .75rem; color: var(--gray-600); }
.leg-item { display: flex; align-items: center; gap: 4px; }
.leg-dot { width: 14px; height: 14px; border-radius: 4px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card { background: var(--white); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; text-align: center; }
.stat-num { font-size: 1.6rem; font-weight: 800; color: var(--g2); }
.stat-label { font-size: .7rem; color: var(--gray-400); margin-top: 2px; }

.table-wrap { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; }
.table-head-bar { background: var(--g2); color: var(--white); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius) var(--radius) 0 0; }
.table-head-bar h3 { font-size: .9rem; font-weight: 700; }

table { width: 100%; border-collapse: collapse; min-width: 1100px; }
thead th { background: var(--gray-100); padding: 8px 10px; font-size: .72rem; font-weight: 700; color: var(--gray-600); text-align: center; border-bottom: 2px solid var(--gray-200); white-space: nowrap; position: sticky; top: 0; z-index: 10; }
thead th:nth-child(1) { text-align: right; min-width: 180px; }
thead th:nth-child(2) { min-width: 100px; }
thead th:nth-child(3) { min-width: 120px; }
thead th:nth-child(4) { min-width: 160px; }
.week-th { min-width: 80px; }
.week-th .week-label { font-size: .7rem; font-weight: 800; color: var(--g2); }
.week-th .week-dates { font-size: .62rem; color: var(--gray-400); margin-top: 2px; }

tbody tr { border-bottom: 1px solid var(--gray-100); transition: background .1s; }
tbody tr:hover { background: #f0fdf4; }
tbody td { padding: 8px 10px; font-size: .8rem; vertical-align: middle; text-align: center; }
tbody td:first-child { text-align: right; }
.s-name { font-weight: 600; color: var(--gray-800); }
.s-id { font-size: .68rem; color: var(--gray-400); }
.major-badge { display: inline-block; background: var(--green-light); color: var(--g2); border-radius: 8px; padding: 2px 6px; font-size: .65rem; font-weight: 600; }
.entity-badge { display: inline-block; background: #eff6ff; color: #1d4ed8; border-radius: 8px; padding: 2px 6px; font-size: .65rem; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.att-cell { display: flex; justify-content: center; align-items: center; }
.att-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--gray-200);
  background: var(--white); cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; position: relative;
}
.att-btn:hover:not(:disabled) { transform: scale(1.1); }
.att-btn.present { background: #dcfce7; border-color: #86efac; }
.att-btn.absent  { background: #fee2e2; border-color: #fca5a5; }
.att-btn:disabled { background: var(--gray-100); border-color: var(--gray-200); cursor: not-allowed; opacity: .5; }
.att-btn.locked { background: var(--gray-100); border-color: var(--gray-200); cursor: not-allowed; }

/* saving indicator */
.att-btn.saving { animation: savePulse .6s infinite; }
.att-btn.save-ok { box-shadow: 0 0 0 2px var(--green-accent); }
.att-btn.save-err { box-shadow: 0 0 0 2px var(--red); }
@keyframes savePulse { 0%,100%{opacity:1} 50%{opacity:.5} }

.period-p1 { background: #ecfdf5; color: #065f46; border-radius: 6px; padding: 1px 6px; font-size: .65rem; font-weight: 700; }
.period-p2 { background: #eff6ff; color: #1e40af; border-radius: 6px; padding: 1px 6px; font-size: .65rem; font-weight: 700; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--gray-400); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--gray-200); border-top-color: var(--g2); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--gray-800); color: var(--white); padding: 10px 20px; border-radius: 20px; font-size: .84rem; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,.25); transition: transform .3s; z-index: 999; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--g2); }
.toast.error { background: var(--red); }

.ro-banner { background: #fffbeb; border: 1.5px solid var(--amber); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: .8rem; color: #92400e; display: none; }

@media(max-width:768px) {
  .stats { grid-template-columns: repeat(2,1fr); }
  .controls { flex-direction: column; align-items: stretch; }
  .ctrl-select { min-width: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <button onclick="window.location.href='https://ac-rafha-nbu.com'" style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">‹ رجوع</button>
  <div>
    <div class="header-title">سجل الحضور — التدريب الصيفي 1447هـ</div>
    <div class="header-sub" id="hSub">جارٍ التحميل...</div>
  </div>
  <div class="user-badge">👤 <span id="hUser">...</span></div>
</div>

<div class="container">

  <div class="ro-banner" id="roBanner">⚠️ وضع المشاهدة فقط — يمكنك متابعة حضور طلابك دون تعديل</div>

  <div class="controls">
    <span class="ctrl-label">الجهة التدريبية:</span>
    <select class="ctrl-select" id="entitySelect" onchange="onEntityChange()">
      <option value="">— اختر الجهة —</option>
    </select>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#dcfce7;border:2px solid #86efac"></div> حاضر</div>
      <div class="leg-item"><div class="leg-dot" style="background:#fee2e2;border:2px solid #fca5a5"></div> غائب</div>
      <div class="leg-item"><div class="leg-dot" style="background:#f3f4f6;border:2px solid #e5e7eb"></div> مغلق</div>
    </div>
  </div>

  <div class="stats" id="statsBar" style="display:none">
    <div class="stat-card"><div class="stat-num" id="stTotal">0</div><div class="stat-label">إجمالي الطلاب</div></div>
    <div class="stat-card"><div class="stat-num" id="stPresent" style="color:#16a34a">0</div><div class="stat-label">حضور هذا الأسبوع</div></div>
    <div class="stat-card"><div class="stat-num" id="stAbsent" style="color:#dc2626">0</div><div class="stat-label">غياب هذا الأسبوع</div></div>
    <div class="stat-card"><div class="stat-num" id="stPct" style="color:#2563eb">—</div><div class="stat-label">نسبة الحضور</div></div>
  </div>

  <div id="tableWrap">
    <div class="empty-state">اختر الجهة لعرض كشف الحضور</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFwibeIoBOcIdxJul1L7l8fVCK86gZlQcnUVRUsoz0gXAgVsRyPGy-hJ0i_kjIfQWM/exec';

const WEEKS = [
  { n:1, label:'أ1', from:'28 يون', to:'4 يول',  start:'2026-06-28', end:'2026-07-04', p1:true,  p2:false },
  { n:2, label:'أ2', from:'5 يول',  to:'11 يول', start:'2026-07-05', end:'2026-07-11', p1:true,  p2:false },
  { n:3, label:'أ3', from:'12 يول', to:'18 يول', start:'2026-07-12', end:'2026-07-18', p1:true,  p2:false },
  { n:4, label:'أ4', from:'19 يول', to:'25 يول', start:'2026-07-19', end:'2026-07-25', p1:true,  p2:false },
  { n:5, label:'أ5', from:'26 يول', to:'1 أغس',  start:'2026-07-26', end:'2026-08-01', p1:false, p2:true  },
  { n:6, label:'أ6', from:'2 أغس',  to:'8 أغس',  start:'2026-08-02', end:'2026-08-08', p1:false, p2:true  },
  { n:7, label:'أ7', from:'9 أغس',  to:'15 أغس', start:'2026-08-09', end:'2026-08-15', p1:false, p2:true  },
  { n:8, label:'أ8', from:'16 أغس', to:'20 أغس', start:'2026-08-16', end:'2026-08-20', p1:false, p2:true  },
];

const todayStr = new Date().toISOString().split('T')[0];
let currentWeekN = 1;
WEEKS.forEach(function(w) { if (todayStr >= w.start) currentWeekN = w.n; });

let currentUser   = null;
let isViewOnly    = false;
let myEntities    = [];
let allStudents   = {};
let currentEntity = '';
let attendance    = {};
let savedData     = {};
let saveTimers    = {};

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
function initAttendancePage(user) {
  currentUser = user;
  isViewOnly  = (user.role === 'academic_view');
  document.getElementById('hUser').textContent = user.name;
  document.getElementById('hSub').textContent  = isViewOnly ? 'متابعة حضور الطلاب' : 'تسجيل الحضور الأسبوعي';
  if (isViewOnly) document.getElementById('roBanner').style.display = 'block';
  loadData();
}

// ══════════════════════════════════════
// تحميل البيانات
// ══════════════════════════════════════
function loadData() {
  document.getElementById('tableWrap').innerHTML = '<div class="empty-state"><div class="spinner"></div>جارٍ تحميل البيانات...</div>';
  fetch(SCRIPT_URL + '?action=getAttendanceData&password=' + encodeURIComponent(currentUser.password) + '&role=' + currentUser.role)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status !== 'ok') throw new Error(d.message);
      myEntities  = d.entities  || [];
      allStudents = d.students  || {};
      savedData   = {};
      (d.savedWeeks || []).forEach(function(rec) {
        if (!savedData[rec.entity]) savedData[rec.entity] = {};
        if (!savedData[rec.entity][rec.studentId]) savedData[rec.entity][rec.studentId] = {};
        savedData[rec.entity][rec.studentId]['w' + rec.week] = rec.status;
      });
      buildEntitySelect();
    })
    .catch(function(err) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty-state">⚠️ ' + err.message + '</div>';
    });
}

function buildEntitySelect() {
  var sel = document.getElementById('entitySelect');
  sel.innerHTML = '<option value="">— اختر الجهة —</option>';
  myEntities.forEach(function(e) {
    var opt = document.createElement('option');
    opt.value = e; opt.textContent = e;
    sel.appendChild(opt);
  });
  if (myEntities.length === 1) { sel.value = myEntities[0]; onEntityChange(); }
  else document.getElementById('tableWrap').innerHTML = '<div class="empty-state">اختر الجهة لعرض كشف الحضور</div>';
}

function onEntityChange() {
  currentEntity = document.getElementById('entitySelect').value;
  if (!currentEntity) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">اختر الجهة لعرض كشف الحضور</div>';
    document.getElementById('statsBar').style.display = 'none';
    return;
  }
  var students = allStudents[currentEntity] || [];
  attendance = {};
  students.forEach(function(s) {
    attendance[s.id] = {};
    WEEKS.forEach(function(w) {
      var saved    = ((savedData[currentEntity] || {})[s.id]) || {};
      var isActive = (s.period === 'الفترة الأولى' && w.p1) || (s.period === 'الفترة الثانية' && w.p2);
      attendance[s.id]['w' + w.n] = saved['w' + w.n] || (isActive ? 'present' : null);
    });
  });
  renderTable();
}

// ══════════════════════════════════════
// رسم الجدول
// ══════════════════════════════════════
function renderTable() {
  var students = allStudents[currentEntity] || [];
  if (!students.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty-state">لا يوجد طلاب في هذه الجهة</div>';
    return;
  }

  var weeksHeader = WEEKS.map(function(w) {
    return '<th class="week-th"><div class="week-label">' + w.label + '</div><div class="week-dates">' + w.from + '–' + w.to + '</div></th>';
  }).join('');

  var rows = students.map(function(s, i) {
    var isP1 = s.period === 'الفترة الأولى';
    var isP2 = s.period === 'الفترة الثانية';

    var weekCells = WEEKS.map(function(w) {
      var active    = (isP1 && w.p1) || (isP2 && w.p2);
      var isCurrent = w.n === currentWeekN;
      var status    = attendance[s.id] ? attendance[s.id]['w' + w.n] : null;
      var icon      = status === 'present' ? '✅' : status === 'absent' ? '❌' : (active && isCurrent ? '⬜' : '—');
      var cls       = status === 'present' ? 'present' : status === 'absent' ? 'absent' : '';

      if (!active || isViewOnly) {
        return '<td><div class="att-cell"><button class="att-btn ' + cls + ' locked" disabled>' + icon + '</button></div></td>';
      }

      var highlight = (isCurrent && !status) ? 'style="border-color:#15803d;background:#f0fdf4"' : '';
      return '<td><div class="att-cell">'
        + '<button class="att-btn ' + cls + '" id="btn-' + s.id + '-' + w.n + '" ' + highlight
        + ' onclick="toggleStatus(\'' + s.id + '\',' + w.n + ')">' + icon + '</button>'
        + '</div></td>';
    }).join('');

    var periodBadge = isP1 ? '<span class="period-p1">ف1</span>' : '<span class="period-p2">ف2</span>';

    return '<tr>'
      + '<td><div class="s-name">' + s.name + ' ' + periodBadge + '</div><div class="s-id">' + s.id + '</div></td>'
      + '<td><span class="major-badge">' + (s.major||'—') + '</span></td>'
      + '<td><span class="entity-badge" title="' + s.entity + '">' + s.entity + '</span></td>'
      + weekCells
      + '</tr>';
  }).join('');

  document.getElementById('tableWrap').innerHTML =
    '<div class="table-head-bar"><h3>' + currentEntity + '</h3><small style="opacity:.75">' + students.length + ' طالب/طالبة</small></div>'
    + '<div style="overflow-x:auto"><table>'
    + '<thead><tr><th style="text-align:right">الطالب</th><th>التخصص</th><th>الجهة</th>' + weeksHeader + '</tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div>';

  document.getElementById('statsBar').style.display = 'grid';
  updateStats(students);
}

// ══════════════════════════════════════
// تبديل الحالة + حفظ فوري
// ══════════════════════════════════════
function toggleStatus(studentId, weekN) {
  if (!attendance[studentId]) attendance[studentId] = {};
  var cur = attendance[studentId]['w' + weekN];
  // دورة: present → absent → present
  attendance[studentId]['w' + weekN] = (cur === 'absent') ? 'present' : 'absent';

  // تحديث الزر مباشرة بدون إعادة رسم كامل
  var btn = document.getElementById('btn-' + studentId + '-' + weekN);
  if (btn) {
    var newStatus = attendance[studentId]['w' + weekN];
    btn.className = 'att-btn ' + newStatus;
    btn.textContent = newStatus === 'present' ? '✅' : '❌';
  }

  updateStats(allStudents[currentEntity] || []);

  // حفظ فوري مع debounce
  var key = studentId + '_' + weekN;
  if (saveTimers[key]) clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(function() { autoSave(studentId, weekN); }, 600);
}

// ══════════════════════════════════════
// حفظ فوري
// ══════════════════════════════════════
function autoSave(studentId, weekN) {
  var btn = document.getElementById('btn-' + studentId + '-' + weekN);
  if (btn) btn.classList.add('saving');

  var students = allStudents[currentEntity] || [];
  var st = null;
  students.forEach(function(s) { if (s.id === studentId) st = s; });
  var w      = WEEKS[weekN - 1];
  var status = attendance[studentId] ? attendance[studentId]['w' + weekN] : 'present';

  fetch(SCRIPT_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      action:   'saveAttendance',
      password: currentUser.password,
      role:     currentUser.role,
      entity:   currentEntity,
      week:     weekN,
      records:  [{
        studentId:   studentId,
        studentName: st ? st.name   : '',
        entity:      currentEntity,
        teacher:     st ? st.teacher : '',
        major:       st ? st.major   : '',
        week:        weekN,
        weekLabel:   w.label,
        weekFrom:    w.from,
        weekTo:      w.to,
        status:      status,
        days:        0,
        notes:       '',
      }]
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (btn) {
      btn.classList.remove('saving');
      btn.classList.add(d.status === 'ok' ? 'save-ok' : 'save-err');
      setTimeout(function() { if (btn) btn.classList.remove('save-ok','save-err'); }, 2000);
    }
    if (d.status !== 'ok') showToast('تعذّر الحفظ', 'error');
  })
  .catch(function() {
    if (btn) { btn.classList.remove('saving'); btn.classList.add('save-err'); }
    showToast('تعذّر الحفظ — تحقق من الاتصال', 'error');
  });
}

// ══════════════════════════════════════
// إحصائيات
// ══════════════════════════════════════
function updateStats(students) {
  var total = students.length, present = 0, absent = 0;
  students.forEach(function(s) {
    var st = attendance[s.id] ? attendance[s.id]['w' + currentWeekN] : null;
    if (st === 'present') present++;
    if (st === 'absent')  absent++;
  });
  var pct = total > 0 ? Math.round(present / total * 100) : 0;
  document.getElementById('stTotal').textContent   = total;
  document.getElementById('stPresent').textContent = present;
  document.getElementById('stAbsent').textContent  = absent;
  document.getElementById('stPct').textContent     = pct + '%';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type||'');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ══════════════════════════════════════
// تهيئة من URL params (بدل sessionStorage)
// ══════════════════════════════════════
window.addEventListener('DOMContentLoaded', function() {
  var params   = new URLSearchParams(window.location.search);
  var role     = params.get('role');
  var password = params.get('password');
  var name     = params.get('name');

  if (!role || !password) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial;direction:rtl;background:#f0f5f1">'
      + '<div style="text-align:center;padding:40px;background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.1)">'
      + '<div style="font-size:48px;margin-bottom:16px">&#x1F512;</div>'
      + '<div style="font-size:18px;font-weight:700;color:#14532d;margin-bottom:8px">يرجى الدخول من المنصة الرئيسية</div>'
      + '<a href="https://ac-rafha-nbu.com" style="display:inline-block;padding:12px 24px;background:#14532d;color:#fff;border-radius:12px;text-decoration:none;font-weight:700">العودة للمنصة</a>'
      + '</div></div>';
    return;
  }

  initAttendancePage({
    role:     role,
    password: decodeURIComponent(password),
    name:     decodeURIComponent(name || 'مشرف أكاديمي')
  });
});
</script>
</body>
</html>
